[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tracker-core = { path = "crates/tracker-core" }
tracker-vision = { path = "crates/tracker-vision" }
tracker-media = { path = "crates/tracker-media" }
tracker-dataset = { path = "crates/tracker-dataset" }
tracker-app = { path = "crates/tracker-app" }
tracker-ipc = { path = "crates/tracker-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
libc = "0.2"
tempfile = "3"
rust_xlsxwriter = "=0.100.0"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rmcp = { version = "=3.8.0", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
gpui-kit = "=0.8.1"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2

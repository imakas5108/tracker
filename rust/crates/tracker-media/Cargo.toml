[package]
name = "tracker-media"
description = "Video access for Tracker: frame index, exact frames, sequential luma reading (AVFoundation on macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracker-core.workspace = true
tracker-vision.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSError", "NSObject"] }
objc2-av-foundation = { workspace = true, features = ["AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "AVAsynchronousKeyValueLoading", "objc2-core-media", "objc2-core-video", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-media = { workspace = true, features = ["CMSampleBuffer", "CMTime", "CMTimeRange", "CMBase", "objc2-core-video"] }
objc2-core-video = { workspace = true, features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "CVPixelFormatDescription"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFString", "CFNumber", "CFDictionary"] }

[dev-dependencies]
